<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仿真测试自动化工具 · 界面原型 v0.1</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --line:#dfe4ec; --line2:#e8ecf3;
  --ink:#182335; --mut:#5d6b80; --faint:#8a95a8;
  --acc:#1d5fd6; --acc-d:#164aa8; --acc-soft:#e9f0fe;
  --ok:#177a46; --ok-bg:#e6f5ec; --ok-line:#bfe3cd;
  --warn:#a15c00; --warn-bg:#fdf3e0; --warn-line:#f0d9ab;
  --err:#c0302a; --err-bg:#fdecea; --err-line:#f2c6c2;
  --nav:#101c30; --nav2:#16243c; --navline:#223349;
  --mono:"Consolas","Cascadia Mono",monospace;
  --sans:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c6cdd8;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#side{width:218px;min-width:218px;background:var(--nav);color:#cdd8e8;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:14px 16px 12px;border-bottom:1px solid var(--navline)}
.brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(145deg,#2a6de8,#1d5fd6);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.brand b{color:#fff;font-size:14px;letter-spacing:.3px}
.brand small{display:block;color:#7f93b0;font-size:11px;font-weight:400}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav .grp{color:#5f7392;font-size:11px;letter-spacing:1px;padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:#b9c6d8;text-decoration:none;font-size:13px;cursor:pointer;margin:1px 0}
.nav a:hover{background:var(--nav2);color:#fff}
.nav a.on{background:#1d5fd6;color:#fff;box-shadow:0 2px 8px rgba(29,95,214,.35)}
.nav a .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.nav a.on .dot{opacity:1}
.nav a .fr{font-family:var(--mono);font-size:10px;color:#7f93b0;margin-left:auto}
.nav a.on .fr{color:#cfe0ff}
.sidefoot{margin:8px;padding:10px 12px;border:1px solid var(--navline);border-radius:8px;font-size:11px;color:#7f93b0;background:var(--nav2)}
.sidefoot b{color:#c6d4e6}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:52px;min-height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.taskchip{display:flex;align-items:center;gap:8px;min-width:0}
.taskchip .tt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskchip .tid{font-family:var(--mono);font-size:11px;color:var(--acc);background:var(--acc-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}
.topspacer{flex:1}
.ver{font-size:11px;color:var(--faint);white-space:nowrap}
#autodemo{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
#autodemo:hover{background:var(--acc-d)}
#autodemo:disabled{opacity:.55;cursor:wait}
.userchip{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;white-space:nowrap}
.userchip .av{width:26px;height:26px;border-radius:50%;background:#24344d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

#stepper{height:46px;min-height:46px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:0;overflow-x:auto}
.stp{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stp .ci{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:1.5px solid #c4ccd9;color:#9aa5b5;background:#fff}
.stp .lb{font-size:12px;color:var(--faint)}
.stp.done .ci{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.done .lb{color:var(--mut)}
.stp.on .ci{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 4px var(--acc-soft)}
.stp.on .lb{color:var(--acc);font-weight:600}
.stp .bar{width:26px;height:1.5px;background:#c4ccd9;margin:0 8px;flex:none}
.stp.done .bar{background:var(--ok)}

#hint{background:#fffaf0;border-bottom:1px solid var(--warn-line);color:#7a4a00;font-size:12px;padding:5px 18px;display:flex;gap:8px;align-items:center}
#hint b{color:#8a5400}

#view{flex:1;overflow-y:auto;padding:18px}
.wrap{max-width:1240px;margin:0 auto}

/* ---------- generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:14px;font-weight:600}
.card-h .sub{color:var(--faint);font-size:11.5px}
.card-b{padding:14px 16px}
.phead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.phead h2{font-size:17px;font-weight:700}
.phead .tag{font-family:var(--mono);font-size:11px;color:var(--acc);background:var(--acc-soft);border:1px solid #d4e2fb;padding:1px 8px;border-radius:20px}
.phead .desc{color:var(--mut);font-size:12.5px}

.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;border:1px solid transparent;padding:7px 14px;font-size:13px;font-family:var(--sans);cursor:pointer;background:#fff;transition:all .12s;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--acc-d)}
.btn.sec{border-color:#c7cfdc;color:#33415a}
.btn.sec:hover:not(:disabled){border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ok:hover:not(:disabled){background:#115c34}
.btn.danger{background:#fff;border-color:#e6b5b0;color:var(--err)}
.btn.danger:hover:not(:disabled){background:var(--err-bg)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;color:var(--acc)}
.btn.ghost:hover{background:var(--acc-soft)}
.btn .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.btn.sec .spin{border-color:#c7cfdc;border-top-color:var(--acc)}
@keyframes rot{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1.5px 8px;border-radius:20px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.mut{color:#66748a;background:#f1f3f7;border-color:#e0e5ec}
.badge.blue{color:var(--acc);background:var(--acc-soft);border-color:#d4e2fb}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.badge.err{color:var(--err);background:var(--err-bg);border-color:var(--err-line)}
.badge.pulse::before{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}

.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:#f7f9fc;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafbfe}
.tbl .m{font-family:var(--mono);font-size:12px}
.tbl .sub{color:var(--faint);font-size:11.5px;display:block}
.txt{width:100%;border:1px solid #c9d2e0;border-radius:7px;padding:9px 11px;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:#fff;resize:vertical}
.txt:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.lbl{font-size:12px;color:var(--mut);display:block;margin:10px 0 5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f4f9;border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:#33415a}
.chip.x{border-color:#e6b5b0;color:var(--err);background:var(--err-bg);cursor:pointer}
.empty{padding:34px 20px;text-align:center;color:var(--faint);font-size:13px}
.empty .big{font-size:26px;margin-bottom:8px;opacity:.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv b{color:var(--mut);font-weight:600;white-space:nowrap}
.kv div{color:var(--ink)}
.stat{display:flex;gap:26px;padding:6px 0}
.stat .n{font-size:20px;font-weight:700;font-family:var(--mono)}
.stat .l{font-size:11.5px;color:var(--faint);margin-top:1px}
.mini{font-size:12px;color:var(--mut)}
.pbar{height:6px;background:#e8ecf3;border-radius:4px;overflow:hidden;min-width:80px}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.pbar.ok i{background:var(--ok)}
.pbar.err i{background:var(--err)}
.note{font-size:12px;color:var(--mut);background:#f7f9fc;border:1px dashed #d3dae5;border-radius:7px;padding:8px 12px}
.filetag{font-family:var(--mono);font-size:11.5px;background:#0f1b2d;color:#9fd0a5;border-radius:5px;padding:2px 8px}
a.clk{color:var(--acc);cursor:pointer;text-decoration:none}
a.clk:hover{text-decoration:underline}

/* checks */
.ck{display:flex;gap:9px;align-items:flex-start;padding:6px 10px;border-radius:7px;font-size:12.5px;margin:2px 0}
.ck .ic{font-family:var(--mono);font-weight:700;font-size:13px;line-height:1.3}
.ck.ok{background:var(--ok-bg);color:var(--ok)}
.ck.err{background:var(--err-bg);color:var(--err)}
.ck .fx{margin-left:auto;white-space:nowrap}

/* toasts */
#toasts{position:fixed;top:64px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;width:330px}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;box-shadow:0 6px 20px rgba(20,35,60,.14);padding:10px 13px;font-size:12.8px;animation:tin .25s ease}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--err)}
.toast b{display:block;font-size:12.5px;margin-bottom:1px}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1}}

/* modal */
#overlay{position:fixed;inset:0;background:rgba(13,20,33,.55);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
#overlay.on{display:flex}
.modal{background:#fff;border-radius:12px;width:760px;max-width:100%;box-shadow:0 24px 70px rgba(8,15,30,.4);animation:tin .22s ease}
.modal.wide{width:980px}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal-h h4{font-size:14.5px;font-weight:600}
.modal-h .x{margin-left:auto;cursor:pointer;color:var(--faint);font-size:18px;padding:0 6px;border:0;background:none}
.modal-h .x:hover{color:var(--err)}
.modal-b{padding:16px 18px;max-height:72vh;overflow-y:auto}

/* code viewer */
.code{background:#0d1524;color:#d7e2f0;border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.62;overflow:auto;white-space:pre;margin:10px 0}
.code .tg{color:#7fb1ff}.code .el{color:#c8a4ff}.code .at{color:#7ce3b5}.code .cm{color:#5d6f8c}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs .t{padding:7px 15px;font-size:12.5px;cursor:pointer;border:0;background:none;color:var(--mut);border-bottom:2px solid transparent;font-family:var(--sans)}
.tabs .t.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* replay */
#rpwrap{position:relative;background:#0b1220;border-radius:8px;overflow:hidden}
#rp{display:block;width:100%;height:auto}
#rpLive{display:block;width:100%;height:auto}
.rp-ov{position:absolute;left:12px;top:10px;color:#9fb4d8;font-size:12px;font-family:var(--mono)}
.rp-ov b{color:#fff}
.rpctl{display:flex;align-items:center;gap:12px;margin-top:10px}
.rpctl input[type=range]{flex:1;accent-color:var(--acc)}
.rptime{font-family:var(--mono);font-size:13px;color:var(--acc);min-width:76px;text-align:right}
.rpwrapL{position:relative;background:#0b1220;border-radius:8px;overflow:hidden}
.evtbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.evt{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:20px;cursor:pointer;border:1px solid;user-select:none}
.evt.ok{color:#8fe8b4;background:rgba(23,122,70,.15);border-color:rgba(124,227,181,.4)}
.evt.ok:hover{border-color:#8fe8b4}
.evt.bad{color:#ffb3a9;background:rgba(192,48,42,.18);border-color:rgba(255,157,143,.45);animation:blink 1.3s ease-in-out infinite}
.evt.bad:hover{animation:none;border-color:#ffb3a9}
.evt.mut{color:#9fb0c8;background:#1a2436;border-color:#2c3d59;cursor:default}
/* 回放事件同步列表 */
.evlist{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbfcfe}
.evhead{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--mut);background:#f3f6fa;border-bottom:1px solid var(--line)}
.evrow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line2);font-size:12px;cursor:pointer}
.evrow:hover{background:#f4f7fc}
.evrow:first-of-type{border-top:0}
.evrow .et{font-family:var(--mono);font-size:11.5px;color:var(--faint);min-width:88px}
.evrow .ec{font-family:var(--mono);font-size:11.5px;color:#42536b;min-width:130px}
.evrow .en{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evrow .es{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.evrow.hit.on{background:var(--ok-bg);animation:evpop .9s ease}
.evrow.hit.on .es{color:var(--ok);font-weight:700}
.evrow.miss.on{background:var(--err-bg);animation:evpop 1.4s ease infinite}
.evrow.miss.on .es{color:var(--err);font-weight:700}
.evrow.none.on{background:#e9eef7}
.evrow.none.on .es{color:var(--mut)}
@keyframes evpop{0%,100%{box-shadow:inset 0 0 0 2px transparent}35%{box-shadow:inset 0 0 0 2px rgba(29,95,214,.5)}}

/* doc rows */
.drow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line2)}
.drow:last-child{border-bottom:0}
.drow .di{width:34px;height:34px;border-radius:8px;background:#f1f4f9;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.drow .dn{font-size:13.5px;font-weight:600}
.drow .ds{font-size:11.5px;color:var(--faint)}
.drow .meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}

.pg-tip{font-size:12px;color:var(--faint);margin:2px 0 0 0}
.steptitle{font-size:13px;font-weight:600;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.steptitle .no{width:19px;height:19px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <!-- sidebar -->
  <aside id="side">
    <div class="brand">
      <div class="mark">⚙</div>
      <div><b>仿真测试自动化</b><small>SimTest Tool · 原型 v0.6</small></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidefoot"><b>演示说明</b>：数据与格式已按真实模板对齐（pipeline/ 走通样例：想定/指令 JSON → 实体/事件态势 NDJSON），右上角「▶ 自动演示」可重播完整测试流程。</div>
  </aside>

  <!-- main -->
  <div id="main">
    <div id="top">
      <button id="backBtn" class="btn sm sec" onclick="goBack()" disabled style="display:none">← 返回</button>
      <div class="taskchip"><span class="tid">T-026</span><span class="tt">空空弹 WQ01 出版测试（发射后锁定 000681）</span></div>
      <span class="ver">变更单 v1.2 · 出版前测试</span>
      <div class="topspacer"></div>
      <button id="autodemo" onclick="demoFlow()">▶ 自动演示全流程</button>
      <div class="userchip"><span class="av">王</span>工程师·小王</div>
    </div>
    <div id="stepper"></div>
    <div id="hint">✅ 界面原型 v0.6：已按真实模板对齐——想定/指令(JSON) → 仿真器(pipeline\simulator.js) → 实体/事件态势(NDJSON)；事件判读基于 cmreCode 事件码。演示数据为走通样例（脱敏），非真实生成结果。</div>
    <div id="view"></div>
  </div>
</div>
<div id="toasts"></div>
<div id="overlay"></div>

<script>
/* ================= 状态与演示数据 ================= */
var TASK={id:'T-026',name:'空空弹 WQ01 出版测试（发射后锁定 000681）'};

/* 用例基线数据（title 等静态部分；动态阶段标记存于 flags） */
var CASE_BASE=[
 {id:'TC-01',title:'迎头拦截 · 发射-规则触发-命中全链路',cat:'功能边界',pri:'P1',sce:'迎头',
  pre:'想定T026-01.json：蓝方 ZB01 制空平台（Blue，载 WQ01 空空弹×4）迎头接近红方 ZB02 制空平台（Red，直线巡航）。与 pipeline 走通样例同构。',
  steps:['生成想定T026-01.json / 指令T026-01.json','字段级校验通过后提交运行队列','调用仿真器运行，收集实体态势/事件态势 NDJSON'],
  exp:'事件态势中应按时刻产生：CMRE000000001(探测报告@20s) → CMRE000000002(武器发射@40s) → CMRE000000005(规则触发@43s) → CMRE000000003(命中毁伤@76.3s)；目标毁伤后退出仿真(CMRE000000006)。',
  evs:[['CMRE000000001','探测报告事件','蓝方制空平台','00:20.000',1],['CMRE000000002','武器发射事件','蓝方制空平台→红方制空平台','00:40.000',1],['CMRE000000005','规则触发事件（发射后锁定）','蓝方制空平台','00:43.000',1],['CMRE000000003','产生实体毁伤事件','红方制空平台','01:16.300',1]]},
 {id:'TC-02',title:'尾追攻击 · 规则触发域校验（存疑样例）',cat:'规则',pri:'P1',sce:'尾追',
  pre:'想定T026-02.json：蓝方 ZB01 自目标后方尾追（同向），初始斜距较短；指令含 000681 规则动作。',
  steps:['生成想定/指令文件并校验','提交运行','判读 CMRE000000005 规则触发事件'],

  var fails=cs.filter(function(c){return c.run==='fail';});
  h+='<div class="card"><div class="card-b"><div class="chiprow"><span class="chip">运行时长：<b>由想定 endTime-startTime 决定</b></span><span class="chip">随机种子：<b class="m">20260903</b>（固定，可复现）</span><span class="chip">并发度：2</span><span class="chip">输出：实体态势 10s 帧 · 事件全量 NDJSON</span>';

  else{h+='<button class="btn pri" onclick="startRun()" '+(S.runActive||!S.scSubmitted?'disabled':'')+'>'+(S.runActive?'<span class="spin"></span> 运行中…':'▶ 开始批量运行')+'</button>';}

}
function runRow(c){var n=c.id.slice(3);
  var pr=c.run==='idle'?'<div class="pbar"><i style="width:0%"></i></div>':(c.run==='run'?'<div class="pbar"><i style="width:'+c.prog+'%"></i></div>':(c.run==='ok'?'<div class="pbar ok"><i style="width:100%"></i></div>':'<div class="pbar err"><i style="width:100%"></i></div>'));
  var files=(c.run==='ok')?'<span class="filetag">实体态势T026-'+n+'.ndjson</span> <span class="filetag">事件态势T026-'+n+'.ndjson</span> <span class="filetag">run.log</span>':(c.run==='fail'?'<span class="filetag">run.log</span>':'<span class="mini">—</span>');
  var op=c.run==='fail'?'<a class="clk" style="color:var(--err)" onclick="viewLog(\''+c.id+'\')">查看日志</a>':(c.run==='ok'?'<a class="clk" onclick="goPage(\'verdict\')">去判读</a>':'<span class="mini">—</span>');
  return '<tr data-runrow="'+c.id+'"><td class="m">'+c.id+'</td><td class="m" style="font-size:11.5px">想定T026-'+n+'.json / 指令T026-'+n+'.json</td><td data-runst="'+c.id+'">'+caseBadge(c,'run')+'</td><td data-runpr="'+c.id+'">'+pr+'</td><td data-runfl="'+c.id+'">'+files+'</td><td data-runop="'+c.id+'">'+op+'</td></tr>';}
function viewLog(id){openModal('<div class="code" style="color:#f0a8a0">'+esc(FAIL_LOG_TC03)+'</div><p class="pg-tip">TC-03 首次运行：仿真器异常退出。处置建议：固定种子复跑核对（疑为数值偶发异常）。</p>');$('mTitle').textContent='运行日志 · '+id+'（首次运行）';}
function setRunCell(id,what,html){var el=document.querySelector('[data-run'+what+'="'+id+'"]');if(el)el.innerHTML=html;}
function runSummaryHtml(){var cs=approvedCases();var ok=cs.filter(function(c){return c.run==='ok';}).length,fail=cs.filter(function(c){return c.run==='fail';}).length,running=cs.filter(function(c){return c.run==='run';}).length;
  if(!S.runStarted)return '';return '<span style="font-size:12px">'+badge('ok','完成 '+ok)+' '+badge('err','失败 '+fail)+(running?' '+badge('blue pulse','运行中 '+running):'')+'</span>';}
function updateSummary(){var el=document.querySelector('#runSummary');if(el)el.innerHTML=runSummaryHtml();}
function startRun(){
  if(!S.scSubmitted){toast('请先在「想定构建」提交运行队列','err');return;}
  S.runActive=true;S.runStarted=true;S.runDone=false;S.verdictDone=false;S.cases.forEach(function(c){if(c.appr){c.run='queue';c.prog=0;c.verdict='pending';}});
  renderView();toast('<b>批量运行开始</b>：6 组任务进入队列，并发 2','ok');
  scheduleCase('TC-01',0.4,6.0,true);scheduleCase('TC-02',0.8,5.5,true);scheduleCase('TC-03',1.2,3.2,true);
  scheduleCase('TC-04',1.6,6.8,true);scheduleCase('TC-05',2.0,7.2,true);scheduleCase('TC-06',2.4,7.8,true);
  setTimeout(checkRunEnd,8600);}
function scheduleCase(id,delay,dur,failFirst){var c=curCases().find(function(x){return x.id===id;});
  setTimeout(function(){if(!c||c.run==='fail')return;c.run='run';
    var st=Date.now();var iv=setInterval(function(){var el=Date.now();c.prog=Math.min(100,Math.round((el-st)/dur*100));
      setRunCell(c.id,'st',badge('blue pulse','运行中'));setRunCell(c.id,'pr','<div class="pbar"><i style="width:'+c.prog+'%"></i></div>');
      if((el-st)/1000>=dur){clearInterval(iv);if(failFirst&&c.id==='TC-03'&&!c._rerun){c.run='fail';c.prog=100;
        setRunCell(c.id,'st',badge('err','运行失败'));setRunCell(c.id,'pr','<div class="pbar err"><i style="width:100%"></i></div>');
        setRunCell(c.id,'op','<a class="clk" style="color:var(--err)" onclick="viewLog(\''+c.id+'\')">查看日志</a>');
        toast('<b>'+c.id+'</b> 仿真器异常退出（详见日志），已隔离，不影响队列其余项','err');
        updateSummary();}
      else{c.run='ok';c.prog=100;
        setRunCell(c.id,'st',badge('ok','运行成功'));
        setRunCell(c.id,'pr','<div class="pbar ok"><i style="width:100%"></i></div>');
        setRunCell(c.id,'fl','<span class="filetag">实体态势T026-'+c.id.slice(3)+'.ndjson</span> <span class="filetag">事件态势T026-'+c.id.slice(3)+'.ndjson</span> <span class="filetag">run.log</span>');
        setRunCell(c.id,'op','<a class="clk" onclick="goPage(\'verdict\')">去判读</a>');
        updateSummary();}}},80);},delay*1000);}
function checkRunEnd(){var cs=approvedCases();if(cs.some(function(c){return c.run==='run'||c.run==='queue';})){setTimeout(checkRunEnd,400);return;}
  S.runActive=false;
  if(cs.some(function(c){return c.run==='fail';})){S.runDone=false;renderView();toast('<b>批量运行结束</b>：5 成功 / 1 失败。<a class="clk" style="color:var(--acc)" onclick="rerunFails()">↻ 点击重跑失败项</a> 后进入判读','warn');}
  else{finishRun();}}
function finishRun(){S.runDone=true;computeVerdicts();
  renderView();goPage('verdict');
  var cs=approvedCases();var okN=cs.filter(function(c){return c.verdict==='pass';}).length,sp=cs.filter(function(c){return c.verdict==='suspect';}).length,fl=cs.filter(function(c){return c.verdict==='fail';}).length;
  toast('<b>运行完成，自动判读初判</b>：通过 '+okN+' / 存疑 '+sp+' / 不通过 '+fl+'。请人工复核存疑项后确认结论。','ok');}
function rerunFails(){var fs=curCases().filter(function(c){return c.run==='fail';});if(!fs.length)return;
  toast('<b>重跑 '+fs.length+' 项</b>：'+fs.map(function(c){return c.id;}).join('、'),'ok');
  fs.forEach(function(c){c.run='run';c.prog=0;c._rerun=true;renderRunRow(c);var dur=2.6;var st=Date.now();
    var iv=setInterval(function(){var el=(Date.now()-st)/1000;c.prog=Math.min(100,Math.round(el/dur*100));
      if(el>=dur){clearInterval(iv);c.run='ok';c.prog=100;renderRunRow(c);updateSummary();
        var left=approvedCases().filter(function(x){return x.run==='run'||x.run==='queue';});
        if(!left.length){setTimeout(finishRun,600);}}},90);});}
function renderRunRow(c){var row=document.querySelector('[data-runrow="'+c.id+'"]');if(!row)return;row.outerHTML=runRow(c);}
function rerunAll(){if(S.auto)return;S.cases.forEach(function(c){c.run='idle';c.prog=0;c._rerun=false;});S.runDone=false;renderView();toast('已重置运行队列，可重新开始批量运行','warn');}

/* 判读结果（运行完成后自动计算初判） */
function computeVerdicts(){var cs=approvedCases();cs.forEach(function(c){var b=CASE_BASE.find(function(x){return x.id===c.id;});c.evsOk=b.evs.map(function(e){return e[4]===1;});
  var allOk=c.evsOk.every(function(x){return x;});
  c.verdict=allOk?'pass':(c.id==='TC-02'?'suspect':'fail');});
  S.issues=JSON.parse(JSON.stringify(ISSUE_BASE));}

function replayCardHtml(c){var n=c.id.slice(3);
  var b=CASE_BASE.find(function(x){return x.id===c.id;});var evs=b?b.evs:[];
  var hit=0,miss=0,none=0;
  evs.forEach(function(e){if(e[4]===1){hit++;}else if(c.id==='TC-06'&&e[0]==='CMRE000000002'){none++;}else{miss++;}});
  var vb=c.verdict==='pass'?badge('ok','通过'):(c.verdict==='fail'?badge('err','不通过'):(c.verdict==='suspect'?badge('warn pulse','存疑·待复核'):badge('mut','待判')));
  var h='<div class="card"><div class="card-h"><h3>自动复盘 · 态势回放</h3><span class="sub">选中用例即自动播放 · 实体态势文件 实体态势T026-'+n+'.ndjson</span><span style="margin-left:auto"></span><span class="badge blue pulse">自动播放中</span>'+vb+'<button class="btn ghost sm" onclick="stopLive();openReplay(\''+c.id+'\',0)">⛶ 全屏</button></div><div class="card-b">';
  h+='<div class="rpwrapL"><canvas id="rpLive" width="920" height="340"></canvas><div class="rp-ov">自动播放 · 想定T026-'+n+'（pipeline 走通样例轨迹） · <b id="rpliveT" style="color:#7ce3b5">T+00:00.0</b></div></div>';
  h+='<div class="rpctl"><button class="btn sec sm" id="liveBtn" onclick="liveToggle()">❚❚ 暂停</button><button class="btn sec sm" onclick="liveRestart()">↺ 从头</button><input type="range" id="rpliveSlider" min="0" max="600" step="0.5" value="0" oninput="liveSeek(this.value)"><span class="rptime" id="rpliveTime">T+00:00.0</span></div>';
  h+='<div class="evlist"><div class="evhead">事件同步 · 随回放实时点亮<span style="margin-left:auto;font-weight:600">命中 '+hit+(miss?' · 缺失 '+miss:'')+(none?' · 符合(未产生) '+none:'')+'</span></div>'+evSyncRowsHtml('L',c.id)+'</div>';
  h+='<p class="pg-tip" style="margin:8px 0 0">▶ 播放中关键事件按事件态势时刻<b>实时点亮</b>：绿=已产生，红=应发生但未检索到；点击任一行可定位到该时刻人工核对。循环播放自动重置。</p>';
  h+='</div></div>';return h;}

  var evB=CASE_BASE.find(function(x){return x.id===c.id;}).evs;

  evB.forEach(function(e,i){var miss=(e[4]===0&&c.id!=='TC-04');
    if(e[0]==='CMRE000000002'&&c.id==='TC-06'){h+='<tr><td class="m">'+e[0]+'（'+e[1]+'）</td><td class="m" style="color:var(--err)">未产生 ✓符合预期</td><td class="m">—</td><td>'+badge('ok','符合')+'</td><td><span class="mini">期望不产生</span></td></tr>';return;}
    var found=e[4]===1;
    h+='<tr><td class="m">'+e[0]+'<span class="sub" style="display:inline;margin-left:6px">'+e[1]+'</span><span class="sub">对象：'+e[2]+'</span></td><td class="m">'+(found?'<span style="color:var(--ok)">已检索到</span>':'<span style="color:var(--err)">未检索到</span>')+'</td><td class="m">'+e[3]+'</td><td>'+(found?badge('ok','一致'):badge('err','缺失'))+'</td><td>'+(found?'<a class="clk" onclick="viewEvt(\''+c.id+'\',\''+e[3]+'\')">查原始记录</a>':'<a class="clk" onclick="openReplay(\''+c.id+'\','+(i+1)+')">回放定位</a>')+'</td></tr>';});

function selectCase(id){S._sel=id;renderView();}
function setVerdict(id,v){var c=curCases().find(function(x){return x.id===id;});c.verdict=v;
  if(v==='pass'){c.vnote='人工复核确认：'+(id==='TC-02'?'经回放复核为用例条件偏差，修订用例条件后重跑通过':'与预期一致');}
  if(v==='fail'){c.vnote='人工确认缺陷/差异，转缺陷单处理';}
  if(id==='TC-02'&&v==='pass'){var i=S.issues.find(function(x){return x.id==='ISSUE-01';});if(i){i.st='resolved';i.res='用例条件修订（尾追→高前置角）后重跑，规则事件命中，TC-02 判定通过。';}}
  var allFinal=approvedCases().every(function(x){return x.verdict==='pass'||x.verdict==='fail';});
  if(allFinal){S.verdictDone=true;}
  renderView();renderShell();toast('<b>'+id+'</b> 判定：'+(v==='pass'?'通过':v==='fail'?'不通过':'存疑')+'（已留痕）','ok');}
function resIssue(id,k){var i=S.issues.find(function(x){return x.id===id;});
  if(k==='ok'){i.st='resolved';i.res='人工复核确认为误报/非缺陷，问题关闭。';toast('<b>'+id+'</b> 已确认为非缺陷，关闭','ok');}
  else{i.st='confirmed';i.res='已确认缺陷并转缺陷单 DEF-20260903-01（遗留至下版处理）。';toast('<b>'+id+'</b> 已确认缺陷，转缺陷单 DEF-20260903-01','err');}

var GEO={lon0:120.00,lon1:121.90,lat0:30.02,lat1:30.62};
function px(lon){return (lon-GEO.lon0)/(GEO.lon1-GEO.lon0);}
function py(lat){return 1-(lat-GEO.lat0)/(GEO.lat1-GEO.lat0);}
function ptAt(arr,sec){if(!arr||!arr.length)return null;var i=Math.floor(sec/10);if(i>=arr.length)return null;
  var a=arr[i],b=arr[Math.min(i+1,arr.length-1)],f=(sec-i*10)/10;
  return {lon:a[0]+(b[0]-a[0])*f,lat:a[1]+(b[1]-a[1])*f};}
function redExtrap(sec){if(sec<=70)return ptAt(REAL_TRK.R,sec);
  if(sec>80)return null;
  var a=REAL_TRK.R[5],b=REAL_TRK.R[6],dt=sec-70;
  return {lon:b[0]+(b[0]-a[0])/10*dt,lat:b[1]+(b[1]-a[1])/10*dt};}
function rpScene(g,W,H,t,id){
  g.fillStyle='#0b1220';g.fillRect(0,0,W,H);
  /* 网格 */

  for(var lon=120.0;lon<=GEO.lon1;lon+=0.2){var gx=px(lon)*W;g.beginPath();g.moveTo(gx,0);g.lineTo(gx,H);g.stroke();}
  for(var lat=GEO.lat0;lat<=GEO.lat1;lat+=0.1){var gy=py(lat)*H;g.beginPath();g.moveTo(0,gy);g.lineTo(W,gy);g.stroke();}
  /* 机场（静态） */
  var ap={x:px(120.9)*W,y:py(30.5)*H};
  g.fillStyle='#ff9d8f';g.beginPath();g.rect(ap.x-3,ap.y-3,6,6);g.fill();
  g.font='10px Consolas';g.fillStyle='#8a99b2';g.fillText('某机场(Red)',ap.x-30,ap.y+18);
  /* 蓝方轨迹与当前位置 */
  var bp=ptAt(REAL_TRK.B,Math.min(t,600));
  g.strokeStyle='rgba(124,227,181,.35)';g.lineWidth=1.4;g.beginPath();
  for(var s=0;s<=Math.min(t,600);s+=2){var p=ptAt(REAL_TRK.B,s);if(!p)break;var xx=px(p.lon)*W,yy=py(p.lat)*H;if(s===0)g.moveTo(xx,yy);else g.lineTo(xx,yy);}
  g.stroke();
  /* 红方轨迹与当前位置（76.3s 被毁，80s 后消失） */
  g.strokeStyle='rgba(255,157,143,.4)';g.lineWidth=1.4;g.beginPath();
  for(var s2=0;s2<=Math.min(t,76.3);s2+=2){var rp2=ptAt(REAL_TRK.R,Math.min(s2,70));if(!rp2)break;var x2=px(rp2.lon)*W,y2=py(rp2.lat)*H;if(s2===0)g.moveTo(x2,y2);else g.lineTo(x2,y2);}
  g.stroke();
  var ht=REAL_META.hitT, la=40;
  /* 导弹（40s~76.3s，指向命中点） */
  if(t>=la&&t<ht){
    var lp=ptAt(REAL_TRK.B,la), hp=redExtrap(ht), f=(t-la)/(ht-la);
    g.strokeStyle='rgba(255,209,102,.6)';g.lineWidth=1;g.beginPath();g.moveTo(px(lp.lon)*W,py(lp.lat)*H);g.lineTo(px(hp.lon)*W,py(hp.lat)*H);g.stroke();
    var mx=px(lp.lon+(hp.lon-lp.lon)*f)*W, my=py(lp.lat+(hp.lat-lp.lat)*f)*H;
    g.fillStyle='#ffd166';g.beginPath();g.arc(mx,my,3.2,0,6.283);g.fill();
    g.font='10px Consolas';g.fillStyle='#ffd166';g.fillText('WQ01×2',mx+6,my+4);
  }
  /* 单位 */
  if(bp){var bx=px(bp.lon)*W,by=py(bp.lat)*H;g.fillStyle='#7ce3b5';g.beginPath();g.arc(bx,by,6.5,0,6.283);g.fill();g.font='12px Consolas';g.fillStyle='#9fe8c2';g.fillText('蓝方ZB01',bx-24,by-13);}
  var red=redExtrap(t);
  if(t<80&&red){var rx=px(red.lon)*W,ry=py(red.lat)*H;g.fillStyle='#ff9d8f';g.beginPath();g.arc(rx,ry,6.5,0,6.283);g.fill();g.font='12px Consolas';g.fillStyle='#ffb3a9';g.fillText('红方ZB02',rx-24,ry-13);}
  /* 命中爆点 76.3s */
  if(t>=ht&&t<ht+9){var hp2=redExtrap(ht);if(hp2){var hx=px(hp2.lon)*W,hy=py(hp2.lat)*H;
    g.fillStyle='rgba(255,107,94,.85)';g.beginPath();g.arc(hx,hy,26*(1-Math.min(1,(t-ht)/6))+8,0,6.283);g.fill();

    g.fillStyle='#ff6b5e';g.font='11px Consolas';g.fillText('HIT @ 76.3s (CMRE000000003)',hx-100,hy-26);}}
  g.fillStyle='#4d5f7c';g.font='10px Consolas';
  g.fillText('区域 120.0~121.9E / 30.0~30.6N（实体态势帧 lon/lat 驱动，帧距10s）',6,H-8);

  h+='<div class="card"><div class="card-h"><h3>严格匹配规则示例</h3><span class="sub">真实清单以模板与映射库为准</span></div><div class="card-b"><div class="ck ok"><span class="ic">✓</span><span>指令 executor.formation_struct[].entity_type = ZB01 ↔ 想定 lstEquip[].mxnm=CMRM0300000000001（映射库 entityTypeMap）</span></div><div class="ck ok"><span class="ic">✓</span><span>指令 launch.weapon_type = WQ01 ↔ 想定 ammo.mxnm=WQ01（弹药库存充足性）</span></div><div class="ck ok"><span class="ic">✓</span><span>指令 ybnm ↔ 想定 ybnm；fanm 32 位十六进制；executor/target 类型码存在于想定兵力</span></div><div class="ck ok"><span class="ic">✓</span><span>时间窗口：action.start_time/end_time(相对秒) ⊆ 想定 [0, endTime-startTime]</span></div><div class="ck ok"><span class="ic">✓</span><span>期望事件可达：用例期望 cmreCode ↔ 指令 rule_type_code 配置一致（事件由规则产生）</span></div><div class="ck ok"><span class="ic">✓</span><span>实体 ID 对齐：想定 zyId/lstEquip ↔ 实体态势 EntityID ↔ 事件态势 srcID/targetID（38 位）</span></div><p class="pg-tip" style="margin-top:8px">严格匹配项由<b>校验引擎</b>强制执行（不依赖大模型），不一致项零漏报。</p></div></div>';
  h+='<div class="card"><div class="card-h"><h3>事件类型字典（示例）</h3></div><div class="card-b" style="padding:6px 10px"><table class="tbl"><thead><tr><th>事件码</th><th>名称</th><th>关键字段</th><th>用途</th></tr></thead><tbody>';

/* ================= 自动演示 ================= */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function demoFlow(){if(S.auto)return;S.auto=true;$('autodemo').disabled=true;
  (async function(){
    resetFlow();S.hist=[];S.page='gen';renderShell();renderView();
    toast('<b>自动演示开始</b>：以 T-026「空空弹 WQ01 出版测试」为例，重播完整测试流程','ok');
    await sleep(900);
    /* 1 生成 */
    S.genLoading=true;renderView();await sleep(1500);
    S.genLoading=false;S.descGen=true;S.cases=deepCases();S.cases.forEach(function(c){c.appr=false;});
    renderView();toast('<b>STEP1 FR-1</b>：大模型已生成测试方案 + 12 条用例（建议稿）','ok');await sleep(1200);
    /* 2 审定 */
    S.approved=true;S.cases.forEach(function(c){c.appr=true;});renderView();
    toast('<b>STEP2</b>：人工审定通过（留痕），进入想定构建','ok');await sleep(900);
    /* 3 想定生成 */
    S.page='scen';renderShell();renderView();await sleep(500);
    S.scLoading=true;renderView();await sleep(1300);
    S.scLoading=false;S.scGen=true;S.cases.forEach(function(c){if(c.appr){c.sc=true;c.scErr=(c.id==='TC-02');}});
    renderView();toast('<b>STEP3 FR-2</b>：6 组想定/方案已生成，TC-02 存在 1 项严格匹配未通过','warn');await sleep(1500);
    /* 4 自动修正 */
    var c2=S.cases.find(function(c){return c.id==='TC-02';});c2.scErr=false;renderView();
    toast('<b>STEP4</b>：TC-02 已自动修正（指令 rules[] 追加 rule_type_code=000681），全部校验通过','ok');await sleep(1000);
    S.scSubmitted=true;goPage('run');
    toast('<b>STEP5 FR-3</b>：6 组已提交运行队列，开始批量运行（并发 2）','ok');await sleep(800);
    S.runActive=true;S.runStarted=true;S.cases.forEach(function(c){c.run='queue';c.prog=0;});
    renderView();
    scheduleCase('TC-01',0.3,2.6,true);scheduleCase('TC-02',0.6,2.4,true);scheduleCase('TC-03',0.9,1.8,true);
    scheduleCase('TC-04',1.2,2.9,true);scheduleCase('TC-05',1.5,3.1,true);scheduleCase('TC-06',1.8,3.3,true);
    while(!approvedCases().every(function(c){return c.run==='ok'||c.run==='fail';})){await sleep(300);}
    S.runActive=false;renderView();
    toast('<b>STEP6</b>：运行结束——5 成功 / TC-03 异常退出（已隔离）。点击重跑失败项','warn');await sleep(1300);
    var f=S.cases.find(function(c){return c.run==='fail';});
    if(f){f.run='run';f.prog=0;renderView();await sleep(2200);f.run='ok';f.prog=100;}
    S.runDone=true;computeVerdicts();renderView();
    toast('<b>STEP7</b>：TC-03 重跑通过。自动判读初判：4 通过 / 1 存疑 / 1 不通过','ok');await sleep(1400);
    /* 判读 */
    S.page='verdict';renderShell();renderView();S._sel='TC-02';
    toast('<b>STEP8 FR-4</b>：TC-02 存疑——「发射后锁定」事件未检索到，唤起回放器复核','warn');await sleep(1500);
    S._sel='TC-02';renderView();
    var c2b=S.cases.find(function(c){return c.id==='TC-02';});
    c2b.verdict='pass';c2b.vnote='经回放复核：规则触发域为迎头/高前置角，尾追条件不匹配；修订用例条件后重跑通过。';
    var i1=S.issues.find(function(x){return x.id==='ISSUE-01';});i1.st='resolved';i1.res='用例条件修订后重跑通过（TC-02 判定通过）。';
    toast('<b>STEP9</b>：人工复核 TC-02 → 判定通过（用例条件偏差，已修订）','ok');await sleep(1200);
    S._sel='TC-06';renderView();
    var c6=S.cases.find(function(c){return c.id==='TC-06';});
    c6.verdict='fail';c6.vnote='人工确认缺陷：包线外发射未抑制，转缺陷单 DEF-20260903-01 遗留下版。';
    var i2=S.issues.find(function(x){return x.id==='ISSUE-02';});i2.st='confirmed';i2.res='已确认缺陷并转单 DEF-20260903-01，遗留处理。';
    toast('<b>STEP10</b>：TC-06 人工确认缺陷 → 判定不通过（遗留至下版）','err');await sleep(1300);
    S.verdictDone=true;goPage('docs');
    toast('<b>STEP11 FR-5</b>：一键生成过程文档包（5 份文档 + 追溯表）','ok');await sleep(1000);
    S.docLoading=true;S._docDone=-1;renderView();await sleep(700);S._docDone=0;renderView();await sleep(700);S._docDone=1;renderView();await sleep(700);S._docDone=2;renderView();await sleep(700);S._docDone=3;renderView();await sleep(700);
    S.docLoading=false;S.docGen=true;S.docsDone=true;renderView();
    toast('<b>演示完成 ✅</b>：全链路已走通——文字描述 → 用例 → 想定/方案 → 批量运行 → 判读 → 文档归档。您可在各页面手动操作体验。','ok');
    S.auto=false;$('autodemo').disabled=false;
  })();}

  renderShell();renderView();}
bootPage();
